name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agias_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d agias_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agias_dev
      JWT_SECRET_KEY: ci-test-secret
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      S3_BUCKET_NAME: ci-test-bucket
      S3_PUBLIC_BASE_URL: http://localhost:9000/ci-test-bucket
      CSRF_ENABLED: false
      CROSS_SITE_COOKIES: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run checks
        run: bun run check
