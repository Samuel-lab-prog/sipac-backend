services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sipac_dev
    ports:
      - '5432:5432'
    volumes:
      - sipac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sipac_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sipac_dev?schema=public
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: sipac-assets
      S3_PUBLIC_BASE_URL: http://localhost:9000/sipac-assets
      TRUST_PROXY: false
      TRUSTED_PROXY_IPS: ''
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'

volumes:
  sipac_pgdata:
